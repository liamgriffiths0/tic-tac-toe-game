<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
body{font-family:Arial;background:#eef2ff;text-align:center;padding:25px}
main{max-width:450px;margin:auto;background:white;padding:30px;border-radius:16px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}
.cell{aspect-ratio:1;background:#e0e7ff;color:#4338ca;border:0;border-radius:10px;font-size:40px;cursor:pointer}
.reset{background:#4f46e5;color:white;border:0;padding:13px 22px;border-radius:8px;cursor:pointer}
#status{font-size:22px;color:#4338ca}
</style>
</head>
<body>
<main>
<h1>Tic Tac Toe</h1>
<p>Play with your friends.</p>
<h2 id="status"></h2>
<div id="board"></div>
<button class="reset" onclick="start()">New Game</button>
</main>
<script>
let board,player,finished;
const wins=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];
function start(){
 board=Array(9).fill("");
 player="X";
 finished=false;
 const area=document.getElementById("board");
 area.innerHTML="";
 for(let i=0;i<9;i++){
  const cell=document.createElement("button");
  cell.className="cell";
  cell.setAttribute("aria-label","Cell "+(i+1));
  cell.onclick=()=>play(i,cell);
  area.appendChild(cell);
 }
 document.getElementById("status").textContent="Player X's turn";
}
function play(i,cell){
 if(board[i]||finished)return;
 board[i]=player;
 cell.textContent=player;
 const status=document.getElementById("status");
 if(wins.some(line=>line.every(n=>board[n]===player))){
  status.textContent="Player "+player+" wins!";
  finished=true;
 }else if(board.every(Boolean)){
  status.textContent="It's a draw!";
  finished=true;
 }else{
  player=player==="X"?"O":"X";
  status.textContent="Player "+player+"'s turn";
 }
}
start();
</script>
</body>
</html>
