<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
body{font-family:Arial;background:#f5f3ff;text-align:center;padding:25px}
main{max-width:450px;margin:auto;background:white;padding:25px;border-radius:15px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{height:100px;font-size:40px;font-weight:bold;background:#ede9fe;border:0;border-radius:8px;cursor:pointer}
button.reset{background:#7c3aed;color:white;border:0;padding:12px 20px;border-radius:8px;margin:18px;cursor:pointer}
#status{font-size:20px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Tic Tac Toe</h1>
<p id="status">Player X's turn</p>
<div id="board">
<button class="cell" onclick="play(0)"></button>
<button class="cell" onclick="play(1)"></button>
<button class="cell" onclick="play(2)"></button>
<button class="cell" onclick="play(3)"></button>
<button class="cell" onclick="play(4)"></button>
<button class="cell" onclick="play(5)"></button>
<button class="cell" onclick="play(6)"></button>
<button class="cell" onclick="play(7)"></button>
<button class="cell" onclick="play(8)"></button>
</div>
<button class="reset" onclick="resetGame()">New Game</button>
</main>
<script>
let board=Array(9).fill("");
let player="X";
let finished=false;
const cells=document.querySelectorAll(".cell");
const wins=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];
function play(index){
 if(finished||board[index])return;
 board[index]=player;
 cells[index].textContent=player;
 const won=wins.some(line=>line.every(i=>board[i]===player));
 if(won){
  document.getElementById("status").textContent="Player "+player+" wins!";
  finished=true;
  return;
 }
 if(board.every(cell=>cell!=="")){
  document.getElementById("status").textContent="It's a draw!";
  finished=true;
  return;
 }
 player=player==="X"?"O":"X";
 document.getElementById("status").textContent="Player "+player+"'s turn";
}
function resetGame(){
 board=Array(9).fill("");
 player="X";
 finished=false;
 cells.forEach(cell=>cell.textContent="");
 document.getElementById("status").textContent="Player X's turn";
}
</script>
</body>
</html>
